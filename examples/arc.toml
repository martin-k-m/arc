# A worked example. Copy to your project root and delete what you do not need.
# Arc works with no configuration at all; this file only narrows its guesses.

[cache]
enabled = true
max_size = "20GB"
# Cache runs that exited non-zero. Off by default: a failure usually says more
# about the environment than about the inputs.
cache_failures = false

[trace]
# Observe executions to learn what they actually depend on.
#
# On Linux this is real syscall tracing: it makes the first run of a command
# several times slower and every later cache hit dramatically cheaper, because a
# hit fingerprints only the learned dependencies and never starts the tracer.
# Elsewhere it costs one metadata walk of the project per run.
#
# Turn it off for a CI job that will never hit, or a tree so large that the walk
# outweighs the command. Caching keeps working without it; it just falls back to
# hashing the whole project.
enabled = true

[inputs]
# Empty means "the whole project, honouring .gitignore". Narrowing this is the
# single biggest win for a large repository.
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock"]
exclude = ["**/*.md"]

[outputs]
# Files Arc captures after a miss and restores on a hit. Leave empty to cache
# only stdout, stderr and the exit code, which is what a test run needs.
# `arc run --trace <command>` shows what a command actually writes.
include = ["target/release/mytool"]

[env]
# Added to Arc's default set of build-relevant variables. Values are hashed,
# never stored.
include = ["MY_FEATURE_FLAG"]
exclude = ["TERM"]

# Per-command scoping.
#
# Where Arc can observe reads (Linux), it narrows on its own and these blocks are
# an addition rather than the only source of knowledge — declared inputs are
# always fingerprinted, even if a trace did not happen to read them. Everywhere
# else this is the *only* way to make unrelated edits stop invalidating a
# command.
#
# `match` is a glob against the whole command line. Declarations from every
# matching block are unioned with the settings above, so two blocks can never
# silently cancel each other.
# `name` is optional and never part of execution identity. It only gives the
# task a readable label in `arc graph` and `arc affected`, and a handle for
# `after`.
# A block with both `name` and `command` is *runnable*: `arc ci` can execute it.
# `match` is then unnecessary — the block scopes exactly the command line it
# declares — but you may still add one to scope a wider family of invocations.
[[command]]
name = "test-core"
command = "cargo"
args = ["test", "--workspace"]
inputs = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock"]
tags = ["test"]

[[command]]
name = "lint"
command = "cargo"
args = ["clippy", "--workspace", "--all-targets"]
inputs = ["src/**", "Cargo.toml", "Cargo.lock"]
tags = ["fast"]

[[command]]
match = "npm*"
inputs = ["app/**", "package.json", "package-lock.json"]
env = ["NODE_ENV"]

# Arc infers task edges from what one command writes and another reads, so most
# ordering needs no configuration. `after` is for the dependencies no filesystem
# observation can reveal — a deploy that must follow a smoke test, say. Naming a
# task that does not exist is reported by `arc graph` and `arc doctor` rather
# than silently ignored.
[[command]]
name = "package"
match = "*make package*"
after = ["test-core"]

[remote]
# A shared cache: a result produced on one machine is reused on another.
# Everything the remote returns is verified locally before it is used, and an
# unreachable or misbehaving server only ever costs a cache hit.
enabled = true
url = "https://cache.example.com"
# Required. Isolates execution metadata; there is no safe way to guess one.
namespace = "my-project"
# The *name* of an environment variable holding the bearer token. The token
# itself never appears in configuration, history, records or logs.
token_env = "ARC_CACHE_TOKEN"
# An untrusted CI job (a fork's pull request) should read but not write.
read = true
write = true

[ci]
# What `arc ci` runs. Every entry must name a runnable [[command]] above;
# naming one that does not exist is an error rather than a silent skip. Omit
# `tasks` entirely and every runnable command is used.
tasks = ["test-core", "lint"]

# When Arc may publish to the remote cache from CI.
#
#   "trusted"  only from events Arc can positively identify as trusted.
#              A fork pull request is not one, and neither is
#              pull_request_target. This is the default.
#   "always"   publish regardless. Only for a cache no untrusted code can reach.
#   "never"    never publish from CI; read only.
#
# Whatever this says, never pass a cache-write token to a fork's pull request.
remote_write = "trusted"

[remote.execution]
# Run cache misses on a remote worker. Off by default: a shared cache is a safe
# default, but sending commands to another machine is a decision somebody makes.
#
# Arc only sends a command it can send honestly. Anything it cannot — a
# different platform, an argument naming a path on this machine, a required
# variable that looks like a secret, a read outside the project, a toolchain
# whose contents differ — runs locally instead, and `arc run --explain` says
# which it was.
enabled = false
url = "http://127.0.0.1:7921"
# Falls back to [remote] token_env when empty. A token that may read the cache
# is not automatically a token that may make a machine run commands.
token_env = "ARC_WORKER_TOKEN"
# Variables that may be sent to a worker despite looking like secrets. Empty by
# default, and deliberately per-variable: there is no wildcard.
allow_env = []
# Give up on a remote execution after this long and report it, rather than
# waiting forever on a worker that may be gone.
timeout_ms = 1800000

# Commands whose effects Arc cannot see should never leave this machine. Arc
# does not try to detect them; say so.
[[command]]
name = "deploy"
command = "./scripts/deploy.sh"
remote = "never"
