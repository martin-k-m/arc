name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Several tests exercise `arc affected`, which needs a real repository.
      - run: git config --global user.email ci@example.com
      - run: git config --global user.name ci
      # --no-fail-fast so one failing test binary does not hide the others.
      # Twice now a real cross-platform bug has sat behind an unrelated
      # failure, invisible until that one was fixed.
      # ARC_TEST_DIAG arms the diagnostics for docs/BUGS.md #11 and #12, which
      # print only when their assertion fails. Both are rare and have never
      # reproduced on demand, so the workspace run is where they get caught.
      - run: cargo test --workspace --no-fail-fast
        env:
          ARC_TEST_DIAG: "1"
      - run: cargo build --release
      - run: cargo run --release -q -p arc-core --example graph_bench
      - run: cargo run --release -q -p arc-core --example ci_bench

  # Remote execution needs a cache, a worker and a client talking to each other
  # over real sockets, which only an end-to-end run exercises.
  remote-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: git config --global user.email ci@example.com
      - run: git config --global user.name ci
      - run: cargo test -p arc-cli --test remote_exec -- --test-threads=3
      - run: bash scripts/remote-exec-demo.sh
      - run: bash scripts/exec-bench.sh

  # The Linux tracer is the one component whose behaviour depends on the
  # sandbox it runs in, so it is exercised both ways: under a container's
  # default seccomp profile, and with ptrace explicitly forbidden. The second
  # must fall back cleanly rather than fail.
  tracing-sandboxes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: report capabilities
        run: ./target/release/arc doctor
      - name: default sandbox
        run: cargo test --workspace --test linux_trace
      # The runner is a VM, not a container, so both Linux backends are really
      # available here and the differential suite actually compares them rather
      # than skipping. If it starts skipping, that is a regression in
      # availability detection and worth failing on.
      - name: ptrace against seccomp
        run: |
          ./target/release/arc doctor | grep -q 'linux-seccomp *available' ||
            { echo "the fast backend is unavailable on this runner" >&2; exit 1; }
          ARC_TEST_DIAG=1 cargo test -p arc-cli --test trace_differential
      # Each denial should cost exactly one backend, and the command must run
      # either way. With ptrace gone Arc still traces completely through
      # seccomp; with both gone it degrades to snapshot and stops claiming to
      # see reads, which is the honest answer rather than a broken one.
      - name: ptrace forbidden
        run: |
          echo '{"defaultAction":"SCMP_ACT_ALLOW","syscalls":[{"names":["ptrace"],"action":"SCMP_ACT_ERRNO"}]}' > /tmp/no-ptrace.json
          out=$(docker run --rm --security-opt seccomp=/tmp/no-ptrace.json \
            -v "$PWD:/w" -w /w ubuntu:24.04 \
            sh -c './target/release/arc doctor && ./target/release/arc run -- echo ok')
          echo "$out"
          grep -q 'preferred *linux-seccomp' <<<"$out"
          grep -q 'linux-ptrace *ptrace denied' <<<"$out"
          grep -q 'best completeness *complete' <<<"$out"

      - name: both Linux backends forbidden
        run: |
          echo '{"defaultAction":"SCMP_ACT_ALLOW","syscalls":[{"names":["ptrace","seccomp"],"action":"SCMP_ACT_ERRNO"}]}' > /tmp/no-trace.json
          out=$(docker run --rm --security-opt seccomp=/tmp/no-trace.json \
            -v "$PWD:/w" -w /w ubuntu:24.04 \
            sh -c './target/release/arc doctor && ./target/release/arc run -- echo ok')
          echo "$out"
          grep -q 'preferred *snapshot' <<<"$out"
          grep -q 'file reads *unsupported' <<<"$out"
          grep -q 'best completeness *partial' <<<"$out"
