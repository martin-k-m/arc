[package]
name = "arc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "arc"
path = "src/main.rs"

[dependencies]
arc-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
# The reference server runs in-process for tests, so a fault can be injected
# without a second binary or a fixed port.
arc-cache = { path = "../arc-cache" }
arc-worker = { path = "../arc-worker" }
arc-core.workspace = true
