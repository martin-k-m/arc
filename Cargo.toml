[workspace]
resolver = "2"
members = ["crates/arc-core", "crates/arc-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"

[workspace.dependencies]
arc-core = { path = "crates/arc-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = { version = "1.5", default-features = false, features = ["std", "pure", "rayon"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.8"
redb = "2"
clap = { version = "4.5", features = ["derive"] }
# Pure-Rust Win32 bindings. Needed for job-object process-tree observation;
# no C toolchain, and only the four modules below are compiled in.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
